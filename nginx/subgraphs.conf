server {
    listen 80;
    server_name _;

    # Health check
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Static subgraph HTML files generated by the chatbot API
    location /subgraphs/ {
        alias /usr/share/nginx/html/subgraphs/;
        autoindex off;
        expires 1d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        add_header X-Content-Type-Options nosniff;
    }

    location = / {
        return 204;
    }
}
