services:
  api:
    build:
      context: ./chatbot-api
      dockerfile: Dockerfile
    container_name: mydepartment-api-prod
    restart: unless-stopped
    # PORT from root .env (compose variable substitution)
    ports:
      - "${PORT:-8566}:${PORT:-8566}"
    env_file:
      - .env
    # The chatbot gateway calls the Department API over its public hostname,
    # which the host resolves to 127.0.1.1 — a loopback the container cannot
    # follow. Pin it to the host so TLS still validates against the real name.
    extra_hosts:
      - "api.mydepartment.ai:host-gateway"
    # No hardcoded app config here — everything comes from root .env.
    # CMD is run_chatbot.py which reads HOST/PORT/RELOAD from env.
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./api_logs:/app/data
      - ./subgraphs:/app/subgraphs
    networks:
      - mydepartment-api-prod_network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.environ['PORT']+'/docs')",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  subgraphs-nginx:
    image: nginx:alpine
    container_name: mydepartment-api-prod_subgraphs_nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8575:80"
    volumes:
      - ./subgraphs:/usr/share/nginx/html/subgraphs:ro
      - ./nginx/subgraphs.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - mydepartment-api-prod_network

  redis:
    image: redis:7-alpine
    container_name: mydepartment-api-prod_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6382:6379"
    volumes:
      - ./redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - mydepartment-api-prod_network

networks:
  mydepartment-api-prod_network:
    driver: bridge
